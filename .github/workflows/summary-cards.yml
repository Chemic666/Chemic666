name: Profile · Summary Cards

on:
  schedule:
    - cron: "59 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/summary-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate light-on-dark profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          AUTO_PUSH: true
          THEME: github_dark
