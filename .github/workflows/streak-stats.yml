name: Profile · Contribution Streak

on:
  schedule:
    - cron: "11 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-streak-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render dark streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render light streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit images safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak-dark.svg profile/streak-light.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh streak [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Could not push streak images after three retries" >&2
            exit 1
          fi
