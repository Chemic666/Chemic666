name: Profile · 3D Contribution City

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/3d-contrib.yml"

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit updated visualization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): refresh 3D contributions [skip ci]"
            git push
          fi
